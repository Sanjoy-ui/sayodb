version: '3.8'

services:
  sayodb-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: sanjoydb/sayodb-server:latest
    container_name: sayodb-server
    restart: unless-stopped
    ports:
      - "6380:6380"
      - "6381:6381"
    volumes:
      - sayodb_data:/data
    environment:
      - SAYODB_PORT=6380
      - SAYODB_HOST=0.0.0.0

  sayodb-gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
    image: sanjoydb/sayodb-gui:latest
    container_name: sayodb-gui
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - sayodb-server

volumes:
  sayodb_data:
    driver: local

