<svg width="640" height="480" viewBox="0 0 640 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. TOP HORIZONTAL INPUT TRACK -->
  <rect x="24" y="72" width="592" height="44" rx="22" fill="#E2E8F0" opacity="0.4"/>

