    <!-- 3D Cube Icon -->
    <g transform="translate(8, 32)">
      <polygon points="22,0 44,11 22,22 0,11" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="0,11 22,22 22,46 0,35" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="22,22 44,11 44,35 22,46" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ITEM 2: RESP & REST APIs -->
  <g transform="translate(216, 20)">
