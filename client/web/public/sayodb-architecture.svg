  <line x1="394" y1="116" x2="394" y2="136" stroke="#64748B" stroke-width="1.5"/>
  <line x1="542" y1="116" x2="542" y2="136" stroke="#64748B" stroke-width="1.5"/>

  <!-- Left Annotation + Curved Arrow -->
