        <path d="M4 10 C4 4, 10 0, 10 6 C12 2, 16 2, 14 10 Z" fill="#DC2626"/>
        <text x="22" y="10" fill="#0F172A" font-family="Satoshi, system-ui, sans-serif" font-size="11" font-weight="700">sayoDB NODE #3</text>
