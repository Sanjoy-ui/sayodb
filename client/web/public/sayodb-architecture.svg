      <ellipse cx="60" cy="100" rx="60" ry="20" fill="#1E40AF" stroke="#0F172A" stroke-width="1.5"/>
      <text x="60" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="11" font-weight="700" letter-spacing="1">DISK</text>

      <!-- Memory Upper Body (Electric Indigo) -->
      <path d="M 0 0 A 60 20 0 0 0 120 0 L 120 50 A 60 20 0 0 1 0 50 Z" fill="#4F46E5" stroke="#0F172A" stroke-width="1.5"/>
      <ellipse cx="60" cy="0" rx="60" ry="20" fill="#6366F1" stroke="#0F172A" stroke-width="1.5"/>
      <text x="60" y="32" text-anchor="middle" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="11" font-weight="700" letter-spacing="1">MEMORY</text>

      <!-- Node Badge -->
      <g transform="translate(18, 126)">
        <path d="M4 10 C4 4, 10 0, 10 6 C12 2, 16 2, 14 10 Z" fill="#4F46E5"/>
        <text x="22" y="10" fill="#0F172A" font-family="Satoshi, system-ui, sans-serif" font-size="11" font-weight="700">sayoDB NODE #2</text>
