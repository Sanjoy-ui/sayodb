      <ellipse cx="60" cy="100" rx="60" ry="20" fill="#1D4ED8" stroke="#0F172A" stroke-width="1.5"/>
      <text x="60" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="11" font-weight="700" letter-spacing="1">DISK</text>

      <!-- Memory Upper Body (Coral Red) -->
      <path d="M 0 0 A 60 20 0 0 0 120 0 L 120 50 A 60 20 0 0 1 0 50 Z" fill="#DC2626" stroke="#0F172A" stroke-width="1.5"/>
      <ellipse cx="60" cy="0" rx="60" ry="20" fill="#EF4444" stroke="#0F172A" stroke-width="1.5"/>
      <text x="60" y="32" text-anchor="middle" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="11" font-weight="700" letter-spacing="1">MEMORY</text>

      <!-- Node Badge -->
